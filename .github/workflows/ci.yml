name: CI

on:
  # 所有分支的推送都会触发本工作流，这样每次提交都会跑一次 android job 并留下 APK。
  # 其中 test/docker 只在 main、PR 与手动触发时需要，它们各自的 if 会跳过其余情况，
  # 被跳过的 job 不占用 runner。
  push:
    branches: ["**"]
  pull_request:
  # Release 建好后只跑 android：把 APK 构建出来并挂成 Release 附件。
  # 注意：release.yml 用 GITHUB_TOKEN 创建的 Release 不会触发这里——GitHub 不会为
  # GITHUB_TOKEN 触发的事件启动新的 workflow run，所以那条路径改由 release.yml 直接
  # 调用可复用工作流完成；保留本事件只是为了兜底“在网页上手工创建 Release”的情况。
  release:
    types: [published]
  # 手动触发：可以临时覆盖 APK 打开的地址。留空则取仓库变量 RSS_POD_WEB_URL。
  workflow_dispatch:
    inputs:
      web_url:
        description: "APK 要打开的网页地址，例如 https://pod.example.com"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # PR 上反复推送的改动取消尚未结束的旧运行，省 runner；
  # 其余的（main、各分支、release）排队而不是取消：每次提交都要留下自己的 APK 产物。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # 只有 main 推送、PR 与手动触发需要跑测试；分支推送和 release 事件都跳过。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rsspod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RSS_POD_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/rsspod_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt 检查，请执行 gofmt -w <文件>"
            printf '%s\n' "$unformatted" | sed 's/^/  /'
            printf '%s\n' "$unformatted" | xargs -r -d '\n' gofmt -d | head -n 200
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    # 同 test：release 发布的是已构建好的镜像，分支推送也不必重复构建。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    # 构建细节都在可复用工作流里，这里只声明“谁来跑、能拿什么权限、传什么输入”。
    uses: ./.github/workflows/android-apk.yml
    # 上传 Release 附件需要写权限；分支推送时用不到，但 job 级权限无法按事件区分。
    permissions:
      contents: write
    with:
      # 只有手动触发才会填这个输入；其余情况由可复用工作流按仓库变量/占位值兜底。
      web_url: ${{ github.event.inputs.web_url }}
      # release 事件时把 tag 传下去，让 APK 既进 Artifacts 也挂成 Release 附件。
      release_tag: ${{ github.event.release.tag_name }}
    # 签名用的 4 个 ANDROID_* secrets 与可选的 RSS_POD_WEB_URL 一并透传。
    secrets: inherit
