name: Android APK

on:
  # 官方 Release 建好后触发（同 tag 的 release.yml 先创建 Release，再发事件），
  # 因此不需要轮询等待 Release 出现，也不会和 release.yml 抢同一个 tag。
  release:
    types: [published]
  # 手动触发：既能临时换地址，也能在不发版时验证 Android 侧改动。
  workflow_dispatch:
    inputs:
      web_url:
        description: "APK 要打开的网页地址，例如 https://pod.example.com（留空则取仓库变量 RSS_POD_WEB_URL）"
        required: false
        type: string

permissions:
  contents: write

env:
  # 优先级：手动输入 → 仓库变量 vars.RSS_POD_WEB_URL → 占位默认值。
  # 真实部署地址不进仓库文件，与 config.example.yaml 的公开/私有边界一致。
  WEB_URL: ${{ github.event.inputs.web_url || vars.RSS_POD_WEB_URL || 'https://pod.example.com' }}

concurrency:
  group: android-apk-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve build inputs
        id: build
        run: |
          set -euo pipefail

          case "$WEB_URL" in
            https://*|http://*) ;;
            *) echo "::error::WEB_URL 必须是 http(s) 绝对地址，当前为 '$WEB_URL'"; exit 1 ;;
          esac
          if [[ "$WEB_URL" != https://* ]]; then
            echo "::warning::$WEB_URL 是明文 http：网页的本地缓存（Cache API）在非安全上下文下不生效"
          fi

          # tag 触发的运行取 tag 作为版本名，手动触发取一次性的 dev 版本。
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          else
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=rss-pod-${version}.apk" >> "$GITHUB_OUTPUT"

          {
            echo "### Android APK"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 页面地址 | \`${WEB_URL}\` |"
            echo "| 版本 | \`${version}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 由 setup-gradle 提供 gradle 命令，仓库里因此不必提交 gradle-wrapper.jar 这类二进制。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          args=(-p android
                -Prsspod.baseUrl="$WEB_URL"
                -Prsspod.versionName="${{ steps.build.outputs.version }}"
                -Prsspod.versionCode="$GITHUB_RUN_NUMBER")

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            args+=(-Prsspod.storeFile="$RUNNER_TEMP/release.keystore"
                   -Prsspod.storePassword="$STORE_PASSWORD"
                   -Prsspod.keyAlias="$KEY_ALIAS"
                   -Prsspod.keyPassword="$KEY_PASSWORD")
            echo "使用 release keystore 签名" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次产出 debug 签名的包，只能自测、不可分发"
            echo "> 未配置签名 secrets，本次为 debug 签名。" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 无 keystore 时 release 变体自动退回 debug 签名（见 app/build.gradle.kts）。
          gradle "${args[@]}" assembleRelease

      - name: Package the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ steps.build.outputs.apk }}"
          sha256sum "dist/${{ steps.build.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "已上传到 Release：$TAG" >> "$GITHUB_STEP_SUMMARY"
