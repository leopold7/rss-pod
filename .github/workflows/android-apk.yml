name: Android APK

# 可复用工作流：构建 WebView 外壳的 release APK，产出 Actions Artifacts，
# 并在给了 release_tag 时把包挂成 GitHub Release 的附件。
#
# 为什么由 caller 显式调用，而不是靠 “release: published” 事件联动：
# Release 是 release.yml 用 GITHUB_TOKEN 创建的，而 GitHub 不会为 GITHUB_TOKEN
# 触发的事件再启动新的 workflow run（只有 workflow_dispatch 与
# repository_dispatch 除外）。那条链永远不会触发，Release 的附件区就只剩 GitHub
# 自动生成的 Source code。改成 caller 直接调用后，一次 run 内就能把附件传上去。
#
# caller 需要给 `contents: write`（上传 Release 附件用）并传 `secrets: inherit`。
on:
  workflow_call:
    inputs:
      web_url:
        description: "APK 要打开的网页地址；留空则依次取仓库变量、Secret、内置占位值"
        required: false
        type: string
        default: ""
      release_tag:
        description: "要附带 APK 的 Release tag；留空表示只产出 Actions Artifacts"
        required: false
        type: string
        default: ""

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 传 Release 附件需要写权限；实际生效的权限还受 caller job 的 permissions 上限约束。
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # 指定了 Release tag 就按 tag 检出，保证附件对应的正是那个版本的代码
          # （手动重跑 release.yml 补历史附件时也走这条）；其余情况用本次运行的提交。
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Resolve build inputs
        id: build
        env:
          INPUT_URL: ${{ inputs.web_url }}
          VARIABLE_URL: ${{ vars.RSS_POD_WEB_URL }}
          SECRET_URL: ${{ secrets.RSS_POD_WEB_URL }}
          ALL_VARIABLES: ${{ toJSON(vars) }}
          PLACEHOLDER_URL: https://pod.example.com
        run: |
          set -euo pipefail

          # 先把 vars 里本次运行真正看得见的变量名打出来（只打名字，不打值）。
          # 名字拼错、大小写不同、建到了 Secrets 或 Environments 页，这三种情况都会在这里现形。
          variables="$(jq -r 'keys | join(", ")' <<< "$ALL_VARIABLES")"
          if [ -z "$variables" ]; then variables="（一个都没有）"; fi
          echo "本次运行可见的仓库变量名：$variables"

          # 三处都能配，按优先级取值，并且把每一处到底配没配打出来。
          if [ -n "$VARIABLE_URL" ]; then
            echo "仓库变量 RSS_POD_WEB_URL：已设置"
          else
            echo "仓库变量 RSS_POD_WEB_URL：未设置"
          fi
          if [ -n "$SECRET_URL" ]; then
            echo "仓库 Secret RSS_POD_WEB_URL：已设置（它不该放这里，应改到 Variables 页）"
          else
            echo "仓库 Secret RSS_POD_WEB_URL：未设置"
          fi

          url="${INPUT_URL:-}"
          source="手动输入的地址"
          if [ -z "$url" ]; then url="${VARIABLE_URL:-}"; source="仓库变量 RSS_POD_WEB_URL"; fi
          if [ -z "$url" ]; then url="${SECRET_URL:-}"; source="仓库 Secret RSS_POD_WEB_URL"; fi
          if [ -z "$url" ]; then url="$PLACEHOLDER_URL"; source="内置占位值"; fi

          case "$url" in
            https://*|http://*) ;;
            *) echo "::error::取到的地址不是 http(s) 绝对地址：'$url'（来源：$source）"; exit 1 ;;
          esac

          if [ "$source" = "内置占位值" ]; then
            echo "::warning::没有取到部署地址，本次 APK 会打开 $url。请在仓库 Settings → Secrets and variables → Actions 的 Variables 页新建 RSS_POD_WEB_URL（注意不是 Secrets 页）。"
          fi
          echo "APK 将加载 $url（来源：$source）"

          # 给了 Release tag 时取 tag 作为版本名；普通提交与手动触发取一次性的 dev 版本，
          # 文件名再带上短 hash，下载后能直接对上是哪次提交。
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            apk="rss-pod-${version}-${GITHUB_SHA:0:7}.apk"
          else
            version="${tag#v}"
            apk="rss-pod-${version}.apk"
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

          {
            echo "### Android APK"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 页面地址 | \`${url}\` |"
            echo "| 地址来源 | ${source} |"
            echo "| 版本 | \`${version}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\`（\`${GITHUB_REF_NAME}\`） |"
            echo "| 产物 | \`${apk}\` |"
            if [ -n "$tag" ]; then
              echo "| Release | \`${tag}\` |"
            fi
            echo ""
            echo "APK 在本页底部的 Artifacts 区，名字就是上表里的产物名。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 由 setup-gradle 提供 gradle 命令，仓库里因此不必提交 gradle-wrapper.jar 这类二进制。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          args=(-p android
                -Prsspod.baseUrl="${{ steps.build.outputs.url }}"
                -Prsspod.versionName="${{ steps.build.outputs.version }}"
                -Prsspod.versionCode="$GITHUB_RUN_NUMBER")

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            args+=(-Prsspod.storeFile="$RUNNER_TEMP/release.keystore"
                   -Prsspod.storePassword="$STORE_PASSWORD"
                   -Prsspod.keyAlias="$KEY_ALIAS"
                   -Prsspod.keyPassword="$KEY_PASSWORD")
            echo "使用 release keystore 签名" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次产出 debug 签名的包，只能自测、不可分发"
            echo "> 未配置签名 secrets，本次为 debug 签名。" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 无 keystore 时 release 变体自动退回 debug 签名（见 app/build.gradle.kts）。
          gradle "${args[@]}" assembleRelease

      - name: Package the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ steps.build.outputs.apk }}"
          sha256sum "dist/${{ steps.build.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "已上传到 Release：$TAG" >> "$GITHUB_STEP_SUMMARY"
