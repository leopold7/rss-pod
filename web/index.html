<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f9ff" />
    <meta name="color-scheme" content="light dark" />
    <title>Commute Podcasts</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Resolve the theme before the first paint so a dark device preference or
      // a stored choice never flashes the light palette.
      (() => {
        const stored = (() => {
          try {
            return localStorage.getItem("rss-pod.theme");
          } catch {
            return null;
          }
        })();
        const dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#0b1420" : "#f4f9ff";
      })();
    </script>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="header-heading-row">
          <h1 id="greeting">What's worth a listen?</h1>
          <div class="header-actions">
            <nav id="language-switcher" class="language-switcher" aria-label="Language">
              <a href="/en" data-locale="en" aria-current="page">EN</a>
              <a href="/zh-cn" data-locale="zh-CN">中文</a>
            </nav>
            <button
              id="theme-toggle"
              class="theme-toggle"
              type="button"
              aria-label="Color theme: follows device"
              title="Color theme: follows device"
              data-mode="system"
              hidden
            >
              <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.9"></circle>
                <path d="M12 4.6a7.4 7.4 0 0 1 0 14.8Z" fill="currentColor"></path>
              </svg>
              <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
                <path
                  d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                ></path>
              </svg>
              <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
                <mask id="theme-toggle-moon-mask">
                  <rect width="24" height="24" fill="#ffffff"></rect>
                  <circle cx="17.6" cy="9.4" r="7.4" fill="#000000"></circle>
                </mask>
                <circle cx="11.6" cy="12" r="8.2" fill="currentColor" mask="url(#theme-toggle-moon-mask)"></circle>
              </svg>
            </button>
            <a
              id="github-link"
              class="github-link"
              href="https://github.com/synrise25/rss-pod"
              target="_blank"
              rel="noreferrer"
              aria-label="View project on GitHub"
              title="View project on GitHub"
            >
              <img src="/icons/github.svg" alt="" />
            </a>
          </div>
        </div>
        <section id="notice-region" class="notice-region" aria-label="Notice" hidden>
          <button id="notice-dismiss" class="notice-dismiss" type="button" aria-label="Dismiss notice" title="Dismiss notice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18M18 6 6 18"></path>
            </svg>
          </button>
          <div id="notice-content" class="notice-content"></div>
        </section>
        <nav id="date-tabs" class="date-tabs" aria-label="Choose a date" tabindex="-1"></nav>
      </header>

      <section id="source-filter-section" class="source-filter-section" aria-label="Filter by source">
        <span id="source-filter-label" class="source-filter-label">Feeds</span>
        <div id="source-filters" class="source-filters"></div>
      </section>

      <section id="episode-region" class="episode-region" aria-label="Podcast episodes">
        <p id="status-message" class="status-message" role="status" aria-live="polite">Loading podcasts…</p>
        <div id="episode-list" class="episode-list" role="list"></div>
      </section>

      <section id="player-dock" class="player-dock" aria-label="Player">
        <div class="transport-controls">
          <button id="play-toggle" class="icon-button icon-button-primary" type="button" aria-label="Play" disabled>
            <img id="play-toggle-icon" src="/icons/play.svg" alt="" />
          </button>
          <button id="previous-button" class="icon-button icon-button-secondary" type="button" aria-label="Previous episode" disabled>
            <img src="/icons/previous.svg" alt="" />
          </button>
          <button id="next-button" class="icon-button icon-button-secondary" type="button" aria-label="Next episode" disabled>
            <img src="/icons/next.svg" alt="" />
          </button>
        </div>

        <div class="now-playing">
          <p class="now-playing-label">
            <span id="now-playing-label">PLAYING</span><span id="now-playing-source" class="now-playing-source"></span>
          </p>
          <p id="now-playing-title" class="now-playing-title">Choose an episode</p>
          <div class="progress-row">
            <input
              id="progress"
              class="progress"
              type="range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Playback progress"
              disabled
            />
            <div class="time-readout" aria-live="off">
              <span id="elapsed-time">0:00</span>
              <span id="remaining-time">--:--</span>
            </div>
          </div>
        </div>

        <div class="speed-panel">
          <span id="speed-label" class="speed-label">Speed</span>
          <fieldset class="speed-control">
            <legend id="speed-legend" class="visually-hidden">Playback speed</legend>
            <button type="button" data-speed="1">1.0×</button>
            <button type="button" data-speed="1.2">1.2×</button>
            <button type="button" data-speed="1.5">1.5×</button>
          </fieldset>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </section>

      <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    </main>

    <template id="episode-row-template">
      <article class="episode-row" role="listitem">
        <button class="episode-play-button" type="button">
          <img src="/icons/play.svg" alt="" />
        </button>
        <span class="episode-source"></span>
        <h2 class="episode-title"></h2>
        <time class="episode-time"></time>
      </article>
    </template>
  </body>
</html>
